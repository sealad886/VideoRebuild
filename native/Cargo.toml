[package]
name = "videorebuild-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py313"] }

[build-dependencies]
pyo3-build-config = "=0.29.2"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
overflow-checks = true
