name: test-and-package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Runtime evidence
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build source distribution and install its wheel
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python tools/build_zipapp.py
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          SOURCE_CHECK="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$SOURCE_CHECK"
          for launcher in run-macos.command run-fragmented-macos.command recover-interactive.command run-legacy-macos.command; do
            bash -n "$SOURCE_CHECK/videorebuild-"*/"$launcher"
          done
          bash "$SOURCE_CHECK/videorebuild-"*/run-macos.command --help
          python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          videorebuild doctor
      - name: Zipapp
        run: |
          python tools/build_zipapp.py
          python videorebuild.pyz doctor
