name: test-and-package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-wheels:
    uses: ./.github/workflows/native-wheels.yml
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, macos-26-intel]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Runtime evidence
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
      - name: Build required native core
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-build.txt
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Rust tests and lints
        run: |
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo test --manifest-path native/Cargo.toml --locked
          cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build source distribution and install its wheel
        run: |
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          SOURCE_CHECK="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$SOURCE_CHECK"
          for launcher in run-macos.command recover-interactive.command; do
            bash -n "$SOURCE_CHECK/videorebuild-"*/"$launcher"
          done
          test ! -e "$SOURCE_CHECK/videorebuild-"*/videorebuild.pyz
          python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          cd "$SOURCE_CHECK"
          python -c 'import importlib.metadata, pathlib, sys, videorebuild, videorebuild.tui; assert pathlib.Path(videorebuild.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); assert importlib.metadata.version("videorebuild") == videorebuild.__version__'
          videorebuild --version
          videorebuild tui --help
          python -m videorebuild --help
          videorebuild doctor
      - name: Zipapp
        run: |
          for wheel in dist/*.whl; do
            standalone="${wheel%.whl}.pyz"
            python tools/build_zipapp.py --wheel "$wheel" --output "$standalone"
            python tools/check_consumers.py --wheel "$wheel" --zipapp "$standalone"
          done
          VERSION="$(PYTHONPATH=src python -c 'import videorebuild; print(videorebuild.__version__)')"
          python tools/check_release.py --dist dist --version "$VERSION"
